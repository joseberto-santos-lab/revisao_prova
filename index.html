<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>TechSoluções - Página Institucional</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  
  <header>
    <h1>limao consutorio</h1>
    <nav>
      <a href="#servicos">Conheça nossos serviços</a>
    </nav>
  </header>


  <main id="container-cartoes">
    
    <section id="sobre">
      <h2>Sobre a empresa</h2>
      <p>Somos uma empresa focada em feser limonada e limao com sal.</p>
    </section>

    <section id="servicos">
      <h2>Nossos serviços</h2>
      </p>No nosso serviço nos fasemos limonada.</p>
      <img src="https://img.magnific.com/vetores-premium/pagina-para-colorir-de-menino-de-desenho-animado-fazendo-limonada-em-uma-jarra_1149527-1283.jpg?semt=ais_hybrid&w=740&q=80" alt="">
    </section>


    <section id="conteudo">
      <h2>Entre em contato</h2>
      <form action="#" method="POST">
        <div>
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required>
        </div>

        <div>
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div>
          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" name="telefone" required>
        </div>

        <button type="submit">Enviar</button>
      </form>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 limaoSoluçoues. Todos os limoes reservados para voce.</p>
  </footer>

</body>
</html>
